<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">心理沙盒最短使用流程</title>
  <desc id="desc">双击 index.html，摆放沙盘，保存 PNG 并复制提示词，最后把图片和提示词一起发给 GPT 等 AI。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#f1eadf"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8dfa2"/>
      <stop offset="1" stop-color="#d9ad62"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#5b4228" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect x="32" y="32" width="1136" height="296" rx="22" fill="#ffffff" opacity="0.72"/>

  <g font-family="Inter, 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif">
    <text x="60" y="78" fill="#203533" font-size="28" font-weight="800">最简单的使用方法</text>
    <text x="60" y="110" fill="#6d6257" font-size="16">本地运行，不自动上传。完成沙盘后，由你主动把 PNG 和提示词交给 AI。</text>

    <g transform="translate(60 145)" filter="url(#softShadow)">
      <rect width="220" height="130" rx="16" fill="#f7fbfa" stroke="#b8d4d1"/>
      <circle cx="42" cy="42" r="22" fill="#2f6f6d"/>
      <path d="M31 48h22c-4-12-8-18-11-18s-8 6-11 18z" fill="#ead19b"/>
      <text x="24" y="92" fill="#1f2d2b" font-size="20" font-weight="800">1. 打开</text>
      <text x="24" y="116" fill="#6d6257" font-size="15">双击 index.html</text>
    </g>

    <path d="M300 210h58" stroke="#91aaa6" stroke-width="4" stroke-linecap="round"/>
    <path d="M350 198l18 12-18 12" fill="none" stroke="#91aaa6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(382 145)" filter="url(#softShadow)">
      <rect width="220" height="130" rx="16" fill="#fffaf0" stroke="#e1c891"/>
      <rect x="25" y="30" width="76" height="52" rx="8" fill="url(#sand)" stroke="#8c6740" stroke-width="5"/>
      <circle cx="78" cy="50" r="8" fill="#6f8752"/>
      <rect x="45" y="57" width="18" height="18" rx="3" fill="#9c7854"/>
      <text x="24" y="92" fill="#1f2d2b" font-size="20" font-weight="800">2. 摆放</text>
      <text x="24" y="116" fill="#6d6257" font-size="15">拖拽沙具，填写感受</text>
    </g>

    <path d="M622 210h58" stroke="#91aaa6" stroke-width="4" stroke-linecap="round"/>
    <path d="M672 198l18 12-18 12" fill="none" stroke="#91aaa6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(704 145)" filter="url(#softShadow)">
      <rect width="220" height="130" rx="16" fill="#f8f4ed" stroke="#d9cbb7"/>
      <rect x="26" y="29" width="58" height="44" rx="7" fill="#ffffff" stroke="#c8b9a4"/>
      <path d="M38 60l12-13 10 10 8-7 10 10" fill="none" stroke="#2f6f6d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="100" y="29" width="70" height="18" rx="9" fill="#2f6f6d"/>
      <rect x="100" y="55" width="88" height="18" rx="9" fill="#e7f4f1"/>
      <text x="24" y="92" fill="#1f2d2b" font-size="20" font-weight="800">3. 导出</text>
      <text x="24" y="116" fill="#6d6257" font-size="15">保存 PNG，复制提示词</text>
    </g>

    <path d="M944 210h58" stroke="#91aaa6" stroke-width="4" stroke-linecap="round"/>
    <path d="M994 198l18 12-18 12" fill="none" stroke="#91aaa6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(1026 145)" filter="url(#softShadow)">
      <rect width="112" height="130" rx="16" fill="#eff7f5" stroke="#b8d4d1"/>
      <circle cx="56" cy="42" r="24" fill="#2f6f6d"/>
      <text x="56" y="50" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="800">AI</text>
      <text x="20" y="92" fill="#1f2d2b" font-size="20" font-weight="800">4. 发送</text>
      <text x="18" y="116" fill="#6d6257" font-size="15">给 GPT/AI</text>
    </g>
  </g>
</svg>
